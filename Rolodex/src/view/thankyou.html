<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You - Rolodex</title>
<link rel="stylesheet" href="style.css">
<style>
  .thankyou-body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background-color: var(--header-bg);
    margin: 0;
  }
  .thankyou-box {
    background: white;
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    max-width: 480px;
  }
</style>
</head>
<!--
=====================================================================
Name:    Christopher Crayton
Date:    August 11, 2026
Purpose: Static confirmation page shown after the user clicks "Quit
         application." No backend dependency - this is a plain
         static page the browser navigates to directly.
=====================================================================
-->
<body class="thankyou-body">
  <div class="thankyou-box">
    <h1>Thank you for using Rolodex!</h1>
    <p>Your contacts have been saved.</p>
    <p>You may now close this browser tab.</p>
  </div>
</body>
</html>
